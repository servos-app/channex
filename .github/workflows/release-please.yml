name: release-please

on:
  push:
    branches: [main]
  # Publishes a release that is already tagged, for when its publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. channex/v0.1.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Opens/updates a release PR from conventional commits and tags vX.Y.Z
      # when it merges. A tag pushed with GITHUB_TOKEN starts no other
      # workflow, so publishing runs here rather than on the tag.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # RubyGems trusted publishing exchanges this OIDC token for a
      # short-lived API key, so the repository holds no RubyGems secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rake test

      # Exchanged by hand because no release of the RubyGems actions passes
      # `owner` yet, and RubyGems creates a new gem through trusted publishing
      # only for the account the workflow names.
      - name: Exchange the OIDC token for a RubyGems API key
        env:
          OWNER: ${{ vars.RUBYGEMS_OWNER_ID }}
        run: |
          test -n "$OWNER" || { echo "Set the RUBYGEMS_OWNER_ID repository variable" >&2; exit 1; }
          jwt=$(curl -sS --fail-with-body -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(curl -sS --fail-with-body -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{jwt: $jwt, owner: $owner}')" | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - run: gem build channex.gemspec

      - run: gem push channex-*.gem
